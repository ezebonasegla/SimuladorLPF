name: Promiedos (exploración)
# Exploración 3: copas (claves de semifinal y final) y cómo vienen los penales.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/promiedos-debug.yml"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar copas
        run: |
          mkdir -p debug/copas
          python3 - <<'PY'
          import json, re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36", "Accept-Language": "es-AR,es;q=0.9"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf8")
          out = {}
          for slug, lid in [("libertadores", "bac"), ("conmebol-sudamericana", "dij"), ("copa-argentina", "gea"), ("liga-profesional", "hc")]:
              h = get(f"https://www.promiedos.com.ar/league/{slug}/{lid}")
              d = json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S).group(1))
              filters = d["props"]["pageProps"]["data"]["games"]["filters"]
              out[lid] = {"filters": filters, "games": {}}
              for f in filters:
                  if lid == "hc" and not re.search(r"Octavos|Cuartos|Semi|Final", f["name"]): continue
                  if lid != "hc" and not re.search(r"Cuartos|Semi|Final", f["name"]): continue
                  try: out[lid]["games"][f["key"] + " " + f["name"]] = json.loads(get(f"https://api.promiedos.com.ar/league/games/{lid}/{f['key']}"))
                  except Exception as e: out[lid]["games"][f["key"]] = str(e)
          json.dump(out, open("debug/copas/copas.json", "w"), ensure_ascii=False, indent=1)
          PY
          ls -la debug/copas
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug
          git diff --cached --quiet || git commit -m "Exploración de promiedos: copas (debug)"
          git push
