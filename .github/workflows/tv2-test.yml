name: Prueba TV 2 (temporal)
on:
  push:
    paths: [".github/workflows/tv2-test.yml"]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in "" "X-VER: 1.11.7.5"; do
            for d in 25-10-2026 26-10-2026 31-10-2026; do
              echo "== [$h] $d"
              curl -sS -A "Mozilla/5.0" ${h:+-H "$h"} -H "Origin: https://simuladorlpf.vercel.app" "https://api.promiedos.com.ar/games/$d" -o out.json -w "%{http_code} %{size_download}\n"
              python3 -c "
          import json
          d=json.load(open('out.json'))
          print('ligas', [l.get('id') for l in d.get('leagues',[])][:12])
          for l in d.get('leagues',[]):
            if l.get('id')=='hc': print(len(l['games']), [ (g['teams'][0]['short_name'], [t['name'] for t in g.get('tv_networks',[])]) for g in l['games']][:3])
          "
            done
          done
