<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador LPF Clausura 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: planilla de cancha. Fixture fijo a la izquierda, tablas en pestañas a la derecha; en celular, todo en pestañas. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #15211c;
  --muted: #5b6a63;
  --line: #d6dfda;
  --accent: #1d6a86;
  --accent-ink: #ffffff;
  --accent-soft: #dcebf1;
  --lib: #a77a06;
  --lib-soft: #f6ecd0;
  --sud: #2b7a4b;
  --sud-soft: #dcefe3;
  --po: #1d6a86;
  --danger: #ad3434;
  --danger-soft: #f6dddd;
  --draw: #8a8f8c;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #151e1b; --surface-2: #1a2521; --ink: #e4ece8; --muted: #94a49d; --line: #283530;
    --accent: #5db1cf; --accent-ink: #0b1a20; --accent-soft: #19323b; --lib: #e2b84d; --lib-soft: #3a3016;
    --sud: #62c48c; --sud-soft: #17352a; --po: #5db1cf; --danger: #e07070; --danger-soft: #3d1d1d; --draw: #9aa29e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151e1b; --surface-2: #1a2521; --ink: #e4ece8; --muted: #94a49d; --line: #283530;
  --accent: #5db1cf; --accent-ink: #0b1a20; --accent-soft: #19323b; --lib: #e2b84d; --lib-soft: #3a3016;
  --sud: #62c48c; --sud-soft: #17352a; --po: #5db1cf; --danger: #e07070; --danger-soft: #3d1d1d; --draw: #9aa29e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--font-body);
  font-variant-numeric: tabular-nums;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1360px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand h1 {
  font: 700 clamp(28px, 4vw, 40px)/1 var(--font-display); letter-spacing: .01em; margin: 0; text-transform: uppercase;
  text-wrap: balance;
}
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: var(--r);
  font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn svg { width: 16px; height: 16px; }

.note {
  margin-top: 16px; padding: 10px 14px; border-radius: var(--r); background: var(--surface-2);
  border: 1px dashed var(--line); color: var(--muted); font-size: 13.5px;
}
.note b { color: var(--ink); font-weight: 600; }

.tabs { display: flex; gap: 2px; margin: 20px 0 14px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0; padding: 10px 14px; font: 600 16px/1 var(--font-display); text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .layout > #pane-partidos { display: block !important; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; }
  .tab[data-tab="partidos"] { display: none; }
}

.panel-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.panel-h h2 { font: 700 22px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.panel-h .sub { color: var(--muted); font-size: 13px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.fecha { margin-bottom: 18px; }
.fecha-h {
  display: flex; align-items: center; gap: 10px; font: 700 18px/1 var(--font-display); text-transform: uppercase; letter-spacing: .05em;
  margin: 6px 0 8px;
}
.fecha-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.group-l { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }

.match {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; margin-bottom: 6px;
}
.match.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.team-n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-n.home { text-align: right; }
.team-n .fav { color: var(--accent); }
.score { display: flex; align-items: center; gap: 4px; }
.score input {
  width: 38px; height: 34px; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2);
  font: 700 18px/1 var(--font-display);
  -moz-appearance: textfield; appearance: textfield;
}
.score input::-webkit-outer-spin-button, .score input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.score input.ai { border-color: var(--accent); background: var(--accent-soft); }
.score span { color: var(--muted); font-weight: 700; }
.probs { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; }
.bar .h { background: var(--accent); }
.bar .d { background: var(--draw); opacity: .55; }
.bar .a { background: var(--lib); }
.plabels { display: flex; gap: 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.plabels b { color: var(--ink); font-weight: 600; }
.plabels .top { color: var(--ink); background: var(--surface-2); border-radius: 4px; padding: 0 4px; box-shadow: inset 0 0 0 1px var(--line); }
.verdict { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.verdict b { color: var(--ink); }

.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; }
th { font: 600 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; }
td { border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
td.l, th.l { text-align: left; }
td.pos { width: 34px; font: 700 16px/1 var(--font-display); color: var(--muted); }
td.pts { font: 700 17px/1 var(--font-display); }
td.team { font-weight: 600; min-width: 140px; }
.delta { font-size: 12px; color: var(--accent); font-weight: 600; margin-left: 4px; }
.mv { font-size: 11px; font-weight: 700; margin-left: 4px; }
.mv.up { color: var(--sud); } .mv.down { color: var(--danger); }
tr.cut td { border-bottom: 2px solid var(--accent); }
tr.in td.pos { color: var(--accent); }
.tag {
  display: inline-block; font: 700 11px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px;
}
.tag.lib { background: var(--lib-soft); color: var(--lib); }
.tag.sud { background: var(--sud-soft); color: var(--sud); }
.tag.champ { background: var(--lib); color: var(--surface); }
.tag.desc { background: var(--danger-soft); color: var(--danger); }
.tag.po { background: var(--accent-soft); color: var(--accent); }
.rowband-lib td:first-child { box-shadow: inset 4px 0 0 var(--lib); }
.rowband-sud td:first-child { box-shadow: inset 4px 0 0 var(--sud); }
.rowband-desc td:first-child { box-shadow: inset 4px 0 0 var(--danger); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.cross { font-size: 12.5px; color: var(--muted); }

.cupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
.cupo-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.cupo-box h3 { margin: 0 0 6px; font: 700 16px/1 var(--font-display); text-transform: uppercase; letter-spacing: .05em; }
.cupo-box.lib h3 { color: var(--lib); } .cupo-box.sud h3 { color: var(--sud); }
.cupo-box ol { margin: 0; padding-left: 20px; }
.cupo-box li { padding: 2px 0; }
.cupo-box small { color: var(--muted); }
.rule { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

/* Playoffs */
.bracket { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.round h3 { font: 700 15px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.round { display: flex; flex-direction: column; }
.round .ties { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
.tie { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tie button {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; padding: 7px 9px; border-bottom: 1px solid var(--line);
}
.tie button:last-child { border-bottom: 0; }
.tie button:hover:not(:disabled) { background: var(--surface-2); }
.tie button:disabled { cursor: default; color: var(--muted); }
.tie .seed { font: 700 13px/1 var(--font-display); color: var(--muted); }
.tie .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tie .pr { font-size: 12px; color: var(--muted); }
.tie button.win { background: var(--accent-soft); }
.tie button.win .nm { color: var(--accent); }
.tie button.lose .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.champion {
  margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--lib);
  border-radius: var(--r); padding: 12px 16px;
}
.champion .big { font: 700 26px/1 var(--font-display); text-transform: uppercase; }
.champion .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--lib); }

/* Proyección */
.pct { position: relative; min-width: 76px; }
.pct i { position: absolute; left: 0; top: 50%; height: 16px; transform: translateY(-50%); background: var(--c, var(--accent)); opacity: .18; border-radius: 3px; }
.pct span { position: relative; }

/* Claves del partido */
.keys { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
.k { font-size: 12px; line-height: 1.3; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.k b { color: var(--ink); font-weight: 600; }
.k.neg { background: var(--danger-soft); color: var(--danger); box-shadow: none; }
.k.pos { background: var(--sud-soft); color: var(--sud); box-shadow: none; }
.k.der { background: var(--lib-soft); color: var(--lib); box-shadow: none; }
.k.neg b, .k.pos b, .k.der b { color: inherit; }

/* Copas */
.cups { display: grid; gap: 14px; }
.cup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.cup h3 { margin: 0; font: 700 19px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.cup .meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.cup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: start; }
.cup-grid .lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.cup-grid .info { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.cup .out { margin-top: 10px; font-size: 13.5px; }
.cup .out b { color: var(--lib); }
.explain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; }
.explain summary { cursor: pointer; font-weight: 600; }
.explain ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
.explain li { padding: 2px 0; }
.explain li b { color: var(--ink); }

/* Datos */
.data-tbl input { width: 58px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); text-align: right; }
.data-tbl td { padding: 4px 6px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 520px) {
  .plabels { font-size: 12px; gap: 7px; }
  .probs { grid-template-columns: minmax(0, 1fr); }
  .score input { width: 34px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Simulador LPF · Clausura 2026</h1>
      <p>Fechas 14, 15 y 16 (más los 3 pendientes de la 13), playoffs y semifinales de Libertadores, Sudamericana y Copa Argentina. Las probabilidades tienen en cuenta el presente, el cansancio por las copas, el historial y lo que se juega cada equipo.</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-ia" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/></svg>
        Completar todo con IA
      </button>
      <button class="btn" id="btn-rand" type="button">Simular al azar</button>
      <button class="btn ghost" id="btn-clear" type="button">Limpiar resultados</button>
      <button class="btn ghost" id="btn-theme" type="button" aria-label="Cambiar entre modo claro y oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="theme-label">Modo claro</span>
      </button>
    </div>
  </header>

  <div class="note" id="data-note"></div>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-tab="partidos" id="tab-partidos">Partidos</button>
    <button class="tab" role="tab" data-tab="zona-a" id="tab-zona-a">Zona A</button>
    <button class="tab" role="tab" data-tab="zona-b" id="tab-zona-b">Zona B</button>
    <button class="tab" role="tab" data-tab="anual" id="tab-anual">Tabla Anual</button>
    <button class="tab" role="tab" data-tab="playoffs" id="tab-playoffs">Playoffs</button>
    <button class="tab" role="tab" data-tab="copas" id="tab-copas">Copas</button>
    <button class="tab" role="tab" data-tab="proyeccion" id="tab-proyeccion">Proyección</button>
    <button class="tab" role="tab" data-tab="datos" id="tab-datos">Datos</button>
  </nav>

  <div class="layout">
    <section id="pane-partidos" class="pane" data-pane="partidos">
      <div class="panel-h">
        <h2>Partidos</h2>
        <div class="chips" id="fecha-chips"></div>
      </div>
      <div id="fixture"></div>
    </section>
    <div>
      <section class="pane" data-pane="zona-a" id="pane-zona-a"></section>
      <section class="pane" data-pane="zona-b" id="pane-zona-b"></section>
      <section class="pane" data-pane="anual" id="pane-anual"></section>
      <section class="pane" data-pane="playoffs" id="pane-playoffs"></section>
      <section class="pane" data-pane="copas" id="pane-copas"></section>
      <section class="pane" data-pane="proyeccion" id="pane-proyeccion"></section>
      <section class="pane" data-pane="datos" id="pane-datos"></section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== DATOS BASE (al 19/10/2026, tras la fecha 13) =====================
   Fuente: promiedos.com.ar (19/10, antes de los 3 partidos pendientes de la fecha 13).

  // Zona B

/* ===================== MODELO DE PROBABILIDADES =====================
   Poisson bivariado con corrección Dixon-Coles (más empates 0-0 y 1-1, típico de la LPF).
   Fuerza base = puntos por partido del Clausura (presente) y de la Anual (nivel) + diferencia de gol.

const HOME_G = 1.20, AWAY_G = 0.90, NEUTRAL_G = 1.05, K = 0.48, RHO = -0.10, RHO_DERBY = -0.18, MAXG = 8;
function strength(t) {

  const cld = t.cl[2] / Math.max(1, t.cl[0]), and = t.an[2] / Math.max(1, t.an[0]);

let stakesCache = null;
function stakes() {
  if (stakesCache) return stakesCache;

  const an = teams.map(t => ({ id: t.id, pts: t.an[1] })).sort((a, b) => b.pts - a.pts);
  const lastPts = an[an.length - 1].pts, line10 = an[9].pts, line4 = an[3].pts;
  for (const z of ["A", "B"]) {
    const rows = zoneRows(z), p8 = rows[7].pts, p9 = rows[8].pts;
    rows.forEach((r, i) => {
      const anp = teams.find(t => t.id === r.id).an[1];
      const out8 = p8 - r.pts > 9;
      const tight = i < 8 ? r.pts - p9 <= 3 : p8 - r.pts <= 3;
      const cupFight = Math.abs(anp - line10) <= 2 || Math.abs(anp - line4) <= 2;
      const releg = anp - lastPts <= 6;
      let v = 0, txt = "";
      if (releg) { v = 0.05; txt = "pelea no terminar último en la Anual"; }
      else if (tight) { v = 0.04; txt = "pelea la clasificación a playoffs"; }
      else if (cupFight) { v = 0.03; txt = "pelea un cupo internacional por la Anual"; }
      else if (out8 && Math.abs(anp - line10) > 9) { v = -0.07; txt = "no tiene nada en juego"; }

const pois = (l, k) => { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; };

function modelS(sh, sa, neutral = false, rho = RHO) {

  if (cache.has(key)) return cache.get(key);

  const la = (neutral ? NEUTRAL_G : AWAY_G) * Math.exp(-K * d);

const model = (hId, aId, neutral) => modelS(teamStr(hId), teamStr(aId), neutral);

const mcache = new Map();
function matchModel(m) {

  let sh = strength(H), sa = strength(A), rho = RHO;
  const keys = [];
  const mh = momentum(H), ma = momentum(A);
  const adj = (side, v) => side === "h" ? (sh += v) : (sa += v);
  for (const [side, t, mo] of [["h", H, mh], ["a", A, ma]]) {
    const v = Math.max(-0.08, Math.min(0.08, 0.12 * mo)); adj(side, v);
    if (mo > 0.35) keys.push({ c: "pos", t: `<b>${esc(t.n)}</b> viene mejor que en el Apertura` });
    else if (mo < -0.35) keys.push({ c: "neg", t: `<b>${esc(t.n)}</b> viene peor que en el Apertura` });
    const fp = formPPG(t);
    if (fp != null) {
      const v = Math.max(-0.1, Math.min(0.1, 0.09 * (fp - t.cl[1] / Math.max(1, t.cl[0])))); adj(side, v);
      if (fp >= 2.25) keys.push({ c: "pos", t: `Racha <b>${esc(t.n)}</b>: ${esc(t.f.split("").join(" "))}` });
      else if (fp <= 0.75) keys.push({ c: "neg", t: `Racha <b>${esc(t.n)}</b>: ${esc(t.f.split("").join(" "))}` });

    if (f) { adj(side, -f[0]); keys.push({ c: "neg", t: `Cansancio <b>${esc(t.n)}</b>: ${f[1]}` }); }
    const s = st[t.id];

function emptyRow(t, kind) {
  const b = kind === "an" ? t.an : t.cl;
  return { id: t.id, n: t.n, z: t.z, pj: b[0], pts: b[1], dg: b[2], gf: b[3] || 0, add: 0 };
}
function applyResult(row, gf, gc) {
  row.pj++; row.dg += gf - gc; row.gf += gf;
  const p = gf > gc ? 3 : gf === gc ? 1 : 0; row.pts += p; row.add += p;
}
const cmp = (a, b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf || a.n.localeCompare(b.n, "es");
function standings(res) {
  const zone = {}, annual = {};
  for (const t of teams) { zone[t.id] = emptyRow(t, "cl"); annual[t.id] = emptyRow(t, "an"); }
  for (const m of MATCHES) {
    const r = res[m.id]; if (!r) continue;
    applyResult(zone[m.h], r[0], r[1]); applyResult(zone[m.a], r[1], r[0]);
    applyResult(annual[m.h], r[0], r[1]); applyResult(annual[m.a], r[1], r[0]);
  }
  const A = Object.values(zone).filter(r => r.z === "A").sort(cmp);
  const B = Object.values(zone).filter(r => r.z === "B").sort(cmp);
  const AN = Object.values(annual).sort(cmp);
  return { A, B, AN };
}
function baseOrder(kind) {
  const rows = teams.map(t => emptyRow(t, kind === "an" ? "an" : "cl"));
  if (kind === "an") return rows.sort(cmp).map(r => r.id);
  return rows.filter(r => r.z === kind).sort(cmp).map(r => r.id);
}

/* ===================== PLAYOFFS =====================
   Octavos: 1A-8B, 2A-7B, 3A-6B, 4A-5B, 1B-8A, 2B-7A, 3B-6A, 4B-5A (local el mejor ubicado).
   Cuadro: [1A-8B / 4B-5A] [2B-7A / 3A-6B] | [1B-8A / 4A-5B] [2A-7B / 3B-6A]. Final en cancha neutral. */
const R16 = [["A",1,"B",8],["B",4,"A",5],["B",2,"A",7],["A",3,"B",6],["B",1,"A",8],["A",4,"B",5],["A",2,"B",7],["B",3,"A",6]];
function seedInfo(st) {
  const s = {};
  st.A.forEach((r, i) => s[r.id] = { z: "A", p: i + 1 });
  st.B.forEach((r, i) => s[r.id] = { z: "B", p: i + 1 });
  st.AN.forEach((r, i) => s[r.id].an = i + 1);
  return s;
}
const better = (s, x, y) => (s[x].p < s[y].p || (s[x].p === s[y].p && s[x].an < s[y].an)) ? [x, y] : [y, x];
function bracket(st, pick) {
  const s = seedInfo(st);
  const ties = [];
  const r16 = R16.map(([z1, p1, z2, p2], i) => {
    const x = (z1 === "A" ? st.A : st.B)[p1 - 1].id, y = (z2 === "A" ? st.A : st.B)[p2 - 1].id;
    const [h, a] = better(s, x, y);
    const t = { id: "o" + i, round: 0, h, a, neutral: false }; t.w = pick(t); ties.push(t); return t;
  });
  const mk = (id, round, t1, t2, neutral) => {
    if (!t1.w || !t2.w) { const t = { id, round, h: t1.w || null, a: t2.w || null, neutral }; ties.push(t); return t; }
    const [h, a] = neutral ? [t1.w, t2.w] : better(s, t1.w, t2.w);
    const t = { id, round, h, a, neutral }; t.w = pick(t); ties.push(t); return t;
  };

  const sf = [0, 1].map(i => mk("s" + i, 2, qf[2 * i], qf[2 * i + 1], false));
  const fin = mk("f", 3, sf[0], sf[1], true);
  return { ties, champ: fin.w || null, seeds: s };
}

   Tienen Libertadores por título: Belgrano (Apertura), el campeón del Clausura, el de la Copa Argentina
   y el campeón de Libertadores o Sudamericana si es argentino (Estudiantes / Boca).
   Se los saca de la Anual y los cupos corren al siguiente (si estaban en el top 9). */
function titleHolders(clausuraChamp, cups) {
  const list = [[APERTURA_CHAMP, "campeón Apertura"]];
  if (clausuraChamp) list.push([clausuraChamp, "campeón Clausura"]);
  if (cups) {
    if (cups.champ.ca) list.push([cups.champ.ca, "campeón Copa Argentina"]);
    if (cups.champ.lib && isLocal(cups.champ.lib)) list.push([cups.champ.lib, "campeón Copa Libertadores"]);
    if (cups.champ.sud && isLocal(cups.champ.sud)) list.push([cups.champ.sud, "campeón Copa Sudamericana"]);
  }
  return list;
}
function cupos(anOrder, clausuraChamp, cups) {
  const holders = titleHolders(clausuraChamp, cups);
  const champs = new Set(holders.map(h => h[0]));
  const pool = anOrder.filter(id => !champs.has(id));
  return { champs: [...champs], holders, lib: pool.slice(0, 3), sud: pool.slice(3, 9) };
}

/* ===================== RENDER: PARTIDOS ===================== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderFixture() {

/* ===================== PROYECCIÓN (Monte Carlo) ===================== */
function runProjection(N = 10000) {
  const ids = teams.map(t => t.id);
  const acc = Object.fromEntries(ids.map(id => [id, { po: 0, first: 0, lib: 0, sud: 0, champ: 0, desc: 0, pts: 0 }]));
  const pending = MATCHES.filter(m => !results[m.id]).map(m => [m, matchModel(m)]);
  const fixed = {};
  for (const m of MATCHES) if (results[m.id]) fixed[m.id] = results[m.id];
  for (let n = 0; n < N; n++) {
    const res = Object.assign({}, fixed);
    for (const [m, mm] of pending) res[m.id] = sample(mm);
    const st = standings(res);
    st.A.slice(0, 8).forEach(r => acc[r.id].po++); st.B.slice(0, 8).forEach(r => acc[r.id].po++);
    acc[st.A[0].id].first++; acc[st.B[0].id].first++;
    const cups = randomCups();
    const br = bracket(st, t => Math.random() < advanceProb(t.h, t.a, t.neutral, cups) ? t.h : t.a);
    acc[br.champ].champ++;
    for (const k of ["lib", "sud", "ca"]) if (cups.champ[k] && acc[cups.champ[k]]) acc[cups.champ[k]][k + "T"] = (acc[cups.champ[k]][k + "T"] || 0) + 1;
    const an = st.AN.map(r => r.id);
    const c = cupos(an, br.champ, cups);
    for (const id of c.champs) acc[id].lib++;
    c.lib.forEach(id => acc[id].lib++); c.sud.forEach(id => acc[id].sud++);
    an.slice(-2).forEach(id => acc[id].desc++);
    st.AN.forEach(r => acc[r.id].pts += r.pts);
  }
  for (const id of ids) for (const k in acc[id]) acc[id][k] /= N;
  for (const id of ids) acc[id].cupT = (acc[id].libT || 0) + (acc[id].sudT || 0) + (acc[id].caT || 0);
  projection = { acc, N, at: new Date() };
}
function renderProjection() {
  const el = document.getElementById("pane-proyeccion");
  if (!projection) runProjection();
  const { acc, N } = projection;
  const rows = teams.slice().sort((a, b) => acc[b.id].pts - acc[a.id].pts || acc[b.id].lib - acc[a.id].lib);
  const cell = (v, c) => `<td class="pct" style="--c:${c}"><i style="width:${Math.round(v * 100)}%"></i><span>${v < 0.005 && v > 0 ? "<1%" : Math.round(v * 100) + "%"}</span></td>`;
  el.innerHTML = `
    <div class="panel-h"><h2>Proyección</h2><span class="sub">${N.toLocaleString("es-AR")} simulaciones de los partidos sin resultado, los playoffs y las copas</span></div>
    <details class="explain" open><summary>Cómo calcula la IA</summary><ul>
      <li><b>Nivel y presente:</b> puntos por partido del Clausura (pesa más) y de la Anual, más la diferencia de gol.</li>
      <li><b>Racha:</b> los últimos 4 partidos de promiedos (V/E/D) frente a su promedio del torneo.</li>
      <li><b>Momento:</b> suma o resta según venga mejor o peor que en el Apertura.</li>
      <li><b>Cansancio:</b> Estudiantes en la fecha 14 (Maracaná el jueves), Boca en la fecha 14 (Río el martes), Atl. Tucumán y Platense en la fecha 15 (Copa Argentina el miércoles). En playoffs resta a quien llegue a una final de copa.</li>
      <li><b>Historial y clásicos:</b> Superclásico, Independiente-Boca, Clásico del Sur y clásico mendocino suben la chance de empate; River-Racing con ventaja histórica de River.</li>
      <li><b>Lo que se juega:</b> suma a quien pelea playoffs, un cupo por la Anual o no terminar último; resta a quien no tiene nada en juego.</li>
      <li><b>Localía:</b> el local espera 1,2 goles contra 0,9 del visitante a igual nivel. Copas: Estudiantes rinde más en la Libertadores que en la liga.</li>
    </ul></details>
    <p class="rule">Los resultados y ganadores que elegiste quedan fijos. Libertadores incluye los cupos por título (Apertura, Clausura, Copa Argentina, Libertadores y Sudamericana).</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="l">Equipo</th><th>Zona</th><th>Pts Anual (prom.)</th><th>Playoffs</th><th>1° de zona</th><th>Campeón Clausura</th><th>Gana una copa</th><th>Libertadores</th><th>Sudamericana</th><th>Desc.</th></tr></thead>
      <tbody>${rows.map(t => `<tr><td class="l team">${esc(t.n)}</td><td>${t.z}</td><td>${acc[t.id].pts.toFixed(1)}</td>
        ${cell(acc[t.id].po, "var(--accent)")}${cell(acc[t.id].first, "var(--accent)")}${cell(acc[t.id].champ, "var(--lib)")}${acc[t.id].cupT ? cell(acc[t.id].cupT, "var(--lib)") : "<td>–</td>"}
        ${cell(acc[t.id].lib, "var(--lib)")}${cell(acc[t.id].sud, "var(--sud)")}${cell(acc[t.id].desc, "var(--danger)")}</tr>`).join("")}</tbody>
    </table></div>
    <div style="margin-top:12px"><button class="btn" type="button" id="btn-proj">Volver a simular</button></div>`;
}

    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" type="button" id="btn-reset-data">Restablecer datos originales</button>
    </div>`;
}

/* ===================== ORQUESTACIÓN ===================== */
function renderTables() {
  const st = standings(results);
  const br = currentBracket(st);
  const cups = userCups();
  // Limpia ganadores que ya no corresponden a la llave
  for (const t of br.ties) if (poWinners[t.id] && poWinners[t.id] !== t.h && poWinners[t.id] !== t.a) delete poWinners[t.id];
  for (const t of cups.ties) if (cupPicks[t.id] && cupPicks[t.id] !== t.h && cupPicks[t.id] !== t.a) delete cupPicks[t.id];
  renderZone("A", st); renderZone("B", st); renderAnnual(st, br, cups); renderPlayoffs(st, br, cups); renderCups(cups, st);
  if (activeTab === "proyeccion") renderProjection();
}
function renderAll() {
  renderChips(); renderFixture(); renderTables(); renderData(); showTab(activeTab);
  const done = MATCHES.filter(m => results[m.id]).length;
  document.getElementById("data-note").innerHTML =
    `<b>Tablas de promiedos al ${DATA_DATE}</b>. Faltan 3 partidos de la fecha 13 que se juegan hoy (Sarmiento-Barracas, Newell's-Central Córdoba y Riestra-Unión): cargá el resultado real o simulalos. Correcciones en la pestaña <b>Datos</b>. Cargados: <b>${done}/${MATCHES.length}</b> partidos.`;
}
function invalidate() { projection = null; cache.clear(); mcache.clear(); stakesCache = null; }
const wide = matchMedia("(min-width: 1100px)");
function showTab(tab) {
  if (wide.matches && tab === "partidos") tab = "zona-a";
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.querySelectorAll(".pane").forEach(p => p.hidden = p.dataset.pane !== tab);
  if (tab === "proyeccion") renderProjection();
  save();
}
/* Modo claro / oscuro: arranca con el del sistema y se recuerda en este navegador. */
const THEME_KEY = "simlpf-theme";
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  return t === "dark" || t === "light" ? t : (darkMQ.matches ? "dark" : "light");
}
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  document.getElementById("theme-label").textContent = currentTheme() === "dark" ? "Modo claro" : "Modo oscuro";
}
function initTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(t === "dark" || t === "light" ? t : null);
  darkMQ.addEventListener?.("change", () => applyTheme(null));
}
function toggleTheme() {
  const t = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
let toastT;
function toast(msg) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200);
}

function fillAI() {
  let n = 0;
  for (const m of MATCHES) if (!results[m.id]) { results[m.id] = aiPick(matchModel(m)); aiFilled[m.id] = true; n++; }
  // Copas y playoffs: avanza el favorito de cada llave
  const cups = resolveCups((t, h, a) => (cupPicks[t.id] === h || cupPicks[t.id] === a) ? cupPicks[t.id] : (cupTieProb(t, h, a) >= 0.5 ? h : a));
  for (const t of cups.ties) if (t.w) cupPicks[t.id] = t.w;
  poWinners = {};
  const st = standings(results);
  const br = bracket(st, t => advanceProb(t.h, t.a, t.neutral, cups) >= 0.5 ? t.h : t.a);
  for (const t of br.ties) if (t.w) poWinners[t.id] = t.w;
  projection = null; save(); renderAll();
  toast(n ? `IA completó ${n} partidos, los playoffs y las copas` : "Playoffs y copas completados con el favorito de cada llave");
}
function fillRandom() {
  for (const m of MATCHES) if (!results[m.id] || aiFilled[m.id]) { results[m.id] = sample(matchModel(m)); aiFilled[m.id] = true; }
  cupPicks = {};
  const cups = randomCups();
  for (const t of cups.ties) if (t.w) cupPicks[t.id] = t.w;
  poWinners = {};
  const st = standings(results);
  const br = bracket(st, t => Math.random() < advanceProb(t.h, t.a, t.neutral, cups) ? t.h : t.a);
  for (const t of br.ties) if (t.w) poWinners[t.id] = t.w;
  projection = null; save(); renderAll();
  toast("Simulación al azar según las probabilidades");
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) return showTab(tab.dataset.tab);
  const chip = e.target.closest(".chip"); if (chip) { fechaFilter = chip.dataset.f; renderChips(); renderFixture(); return; }
  const cupBtn = e.target.closest("button[data-cuptie]");
  if (cupBtn) {
    const id = cupBtn.dataset.cuptie;
    if (cupPicks[id] === cupBtn.dataset.team) delete cupPicks[id]; else cupPicks[id] = cupBtn.dataset.team;
    projection = null; save(); renderTables(); return;
  }
  const tieBtn = e.target.closest("button[data-tie]");
  if (tieBtn) {
    const id = tieBtn.dataset.tie;
    poWinners[id] = poWinners[id] === tieBtn.dataset.team ? undefined : tieBtn.dataset.team;
    if (!poWinners[id]) delete poWinners[id];
    projection = null; save(); renderTables(); return;
  }
  if (e.target.closest("#btn-theme")) return toggleTheme();
  if (e.target.closest("#btn-ia")) return fillAI();
  if (e.target.closest("#btn-rand")) return fillRandom();
  if (e.target.closest("#btn-clear")) {
    results = {}; aiFilled = {}; poWinners = {}; cupPicks = {}; projection = null; save(); renderAll(); toast("Resultados borrados"); return;
  }
  if (e.target.closest("#btn-proj")) { projection = null; renderProjection(); toast("Proyección actualizada"); return; }
  if (e.target.closest("#btn-reset-data")) {
    teams = structuredClone(BASE_TEAMS); invalidate(); save(); renderAll(); toast("Datos originales restablecidos"); return;
  }
});
document.addEventListener("input", e => {
  const inp = e.target;
  if (inp.matches(".score input")) {
    inp.value = inp.value.replace(/\D/g, "").slice(0, 2);
    const box = inp.closest(".match"), id = box.dataset.m;
    const [h, a] = box.querySelectorAll("input");
    delete aiFilled[id]; h.classList.remove("ai"); a.classList.remove("ai");
    if (h.value !== "" && a.value !== "") { results[id] = [+h.value, +a.value]; box.classList.add("done"); }
    else { delete results[id]; box.classList.remove("done"); }
    projection = null; save(); renderTables();
    const done = MATCHES.filter(m => results[m.id]).length;
    document.querySelector("#data-note b:last-child").textContent = `${done}/${MATCHES.length}`;
    if (inp.dataset.side === "0" && inp.value !== "") a.focus(), a.select();
  } else if (inp.matches(".data-tbl input[data-k='f']")) {
    teams[+inp.dataset.i].f = inp.value.toUpperCase().replace(/[^VED]/g, "");
    invalidate(); save(); renderFixture(); renderTables();
  } else if (inp.matches(".data-tbl input")) {
    const v = parseInt(inp.value, 10);
    if (Number.isNaN(v)) return;
    teams[+inp.dataset.i][inp.dataset.k][+inp.dataset.j] = v;
    invalidate(); save(); renderFixture(); renderTables();
  }
});

load();
initTheme();
renderAll();
</script>
</body>
</html>
