name: Prueba TV promiedos (temporal)
on:
  push:
    paths: [".github/workflows/tv-test.yml"]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "games/25-10-2026" "games/26-10-2026" "games/today" "gamecenter/egddcdb"; do
            echo "== $u"
            curl -sS -A "Mozilla/5.0" -H "X-VER: 1.11.7.5" "https://api.promiedos.com.ar/$u" -o out.json -w "%{http_code} %{size_download}\n"
            python3 -c "
          import json
          d=json.load(open('out.json'))
          print(list(d.keys())[:8] if isinstance(d,dict) else type(d))
          ls=d.get('leagues') or []
          for l in ls:
            if l.get('id')=='hc':
              for g in l['games'][:20]: print(g['teams'][0]['name'],'-',g['teams'][1]['name'],g.get('start_time'),[t['name'] for t in g.get('tv_networks',[])])
          if 'game' in d: g=d['game']; print(g.get('start_time'), g.get('tv_networks'), [k for k in g.keys()][:40])
          " || head -c 300 out.json
          done
